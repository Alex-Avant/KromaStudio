<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KromaStudio — QA digital</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0a0b0e;
        color: #f5f0e8;
      }
      body {
        max-width: 900px;
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3rem);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 5vw, 3rem);
      }
      p {
        line-height: 1.5;
        color: #a8a29a;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      button {
        padding: 0.65rem 0.9rem;
        border: 1px solid #f0b45f;
        border-radius: 8px;
        background: #f0b45f;
        color: #18110a;
        font: 600 0.85rem/1.2 system-ui, sans-serif;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #f0b45f;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #qa-summary {
        font: 600 1rem/1.4 ui-monospace, monospace;
      }
      #qa-summary.ok,
      li.ok strong {
        color: #9bd6a3;
      }
      #qa-summary.fail,
      li.fail strong {
        color: #ffb4a8;
      }
      ul {
        display: grid;
        gap: 0.6rem;
        padding: 0;
        list-style: none;
      }
      li {
        display: grid;
        gap: 0.2rem;
        padding: 0.75rem;
        border: 1px solid #24262d;
        border-radius: 10px;
        background: #101216;
      }
      li strong {
        font: 600 0.8rem/1.3 ui-monospace, monospace;
      }
      li span {
        font: 0.8rem/1.5 ui-monospace, monospace;
        color: #b8b2a8;
        overflow-wrap: anywhere;
      }
      code {
        color: #f0b45f;
      }
    </style>
  </head>
  <body>
    <h1>KromaStudio · QA digital</h1>
    <p>
      Exporta patrones sintéticos y comprueba dimensiones, DPI, polaridad,
      transparencia, monotonía tonal y coherencia entre color y underbase. Necesita
      un navegador con WebGPU real. Abre <code>/qa.html</code> desde el servidor de
      desarrollo.
    </p>
    <div class="actions">
      <button id="qa-run" type="button">Ejecutar QA</button>
      <button id="qa-download" type="button" class="secondary" disabled>
        Descargar informe JSON
      </button>
    </div>
    <p id="qa-summary" role="status">Preparando…</p>
    <ul id="qa-results" aria-live="polite"></ul>
    <script type="module" src="/src/qa.ts"></script>
  </body>
</html>
